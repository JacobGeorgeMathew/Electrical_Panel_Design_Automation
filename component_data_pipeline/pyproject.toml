[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-component-data-pipeline"
version = "0.1.0"
description = "Polite, provenance-preserving component catalog staging pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "openpyxl>=3.1,<4", "pdfplumber>=0.11,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
